# Lints, tests and builds the backend and frontend on every pull request
# and on pushes to main and dev.
name: Tests

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14" # same as local development
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint and format check (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: python -m pytest -v

  frontend:
    name: Frontend lint + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint) and type check
        run: |
          npm run lint
          npm run typecheck

      - name: Run tests (vitest)
        run: npm test

      - name: Production build
        run: npm run build
